<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krio to English Data Collector</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f5f6fa;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .app {
    background: white;
    width: 350px;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    text-align: center;
  }
  .output {
    background: #ecf0f1;
    border-radius: 10px;
    padding: 15px;
    min-height: 80px;
    margin-bottom: 15px;
    font-size: 16px;
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 10px;
  }
  button {
    border: none;
    padding: 10px 15px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
  }
  button:hover {
    opacity: 0.8;
  }
  .mic {
    background: #3498db;
    color: white;
    border-radius: 50%;
    width: 60px;
    height: 60px;
    font-size: 25px;
  }
  .approve { background: #2ecc71; color: white; }
  .reject { background: #e74c3c; color: white; }
</style>
</head>
<body>
  <div class="app">
    <div class="output" id="outputText">Speak Krio to start recording...</div>
    <button class="mic" id="micBtn">🎤</button>
    <div class="controls">
      <button class="reject" id="rejectBtn">❌</button>
      <button class="approve" id="approveBtn">✔️</button>
    </div>
  </div>

<script>
  const output = document.getElementById('outputText');
  const micBtn = document.getElementById('micBtn');

  let recognizing = false;
  let recognition;

  if ('webkitSpeechRecognition' in window) {
    recognition = new webkitSpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'en-US'; // placeholder until Krio model available

    recognition.onstart = () => {
      recognizing = true;
      output.textContent = "Listening in Krio...";
      micBtn.style.background = "#e67e22";
    };

    recognition.onresult = (event) => {
      const krioSpeech = event.results[0][0].transcript;
      output.textContent = `Krio: ${krioSpeech}\nTranslating...`;

      // Example translation mock (replace with real API)
      fakeTranslateKrioToEnglish(krioSpeech).then(english => {
        output.textContent = `Krio: ${krioSpeech}\nEnglish: ${english}`;
      });
    };

    recognition.onend = () => {
      recognizing = false;
      micBtn.style.background = "#3498db";
    };
  } else {
    output.textContent = "Speech recognition not supported in this browser.";
  }

  micBtn.addEventListener('click', () => {
    if (recognizing) {
      recognition.stop();
    } else {
      recognition.start();
    }
  });

  document.getElementById('approveBtn').onclick = () => {
    alert('✅ Data saved for training!');
    // Later: send data to backend API here
  };
  document.getElementById('rejectBtn').onclick = () => {
    output.textContent = "Try speaking again.";
  };

  // Temporary fake translator function
  async function fakeTranslateKrioToEnglish(krioText) {
    return new Promise(resolve => {
      setTimeout(() => resolve("Example English translation (mock)"), 1000);
    });
  }
</script>
</body>
</html>
